# Persisted decisions for the /bnma skill's naming/pooling QA gate.
# check_naming_pooling.R reads this file to avoid re-flagging pairs a curator
# has already resolved. When you resolve a new flag during a /bnma run,
# append it here (as a resolved_pairs entry) so future runs don't ask again.
#
# known_compounds: canonical spellings seen in the data so far. Not required
# for the check to work (it derives distinct compounds from the data itself
# each run) -- this list exists so the skill's forced-selection step can
# show "known vs. new" compounds without recomputing history.
#
# resolved_pairs: compound-name pairs a human has already reviewed. `decision`
# is "same" (they're aliases -- the checker will note this but not block on
# it) or "different" (confirmed distinct compounds -- never flag this pair
# again).

known_compounds:
  - semaglutide
  - tirzepatide
  - retatrutide
  - orforglipron
  - survodutide
  - cagrilintide
  - danuglipron
  - brenipatide
  - berobenatide
  - maritide
  - vk2735
  - petrelintide
  - pemvidutide
  - cagrisema
  - eloralintide

resolved_pairs:
  - a: met-097
    b: berobenatide
    decision: same
    note: >
      met-097 is a legacy internal code name for berobenatide. Still appears
      as a distinct `compound` value in some PRD rows as of 2026-08 --
      bnma-nonadj-11AUG2026.R patches this at read-time rather than the
      source data being corrected yet.
  - a: aleniglipron
    b: elecoglipron
    decision: different
    note: >
      Shared "-glipron" suffix common to oral GLP-1 agonists; no other
      evidence of a naming duplicate. Confirmed 2026-08-17.
  - a: oral semaglutide
    b: semaglutide
    decision: different
    note: >
      Same underlying molecule, different route -- kept as distinct compound
      entries rather than merged, since route is tracked via the compound
      string here rather than aom for these two. Confirmed 2026-08-17.
  - a: dapagliflozin
    b: empagliflozin
    decision: different
    note: >
      Low similarity; both real, distinct SGLT2 inhibitors. Confirmed
      2026-08-21 (cwm_wl_t2d run).
  - a: exenatide
    b: exenatide qw
    decision: same
    note: >
      Dosing-frequency suffix, not a distinct compound. Relabel "exenatide
      qw" -> "exenatide" via a run's compound_relabels. Confirmed 2026-08-21
      (cwm_wl_t2d run).
  - a: oralsemaglutide
    b: semaglutide
    decision: different
    note: >
      "oralsemaglutide" is a missing-space variant of "oral semaglutide"
      (see that pair above, already resolved "different" from semaglutide).
      Relabel "oralsemaglutide" -> "oral semaglutide" via a run's
      compound_relabels -- do not merge with semaglutide. Confirmed
      2026-08-21 (cwm_wl_t2d run).
  - a: maridebartcafraglutide
    b: maritide
    decision: same
    note: >
      maritide is Amgen's public name for AMG133/maridebartcafraglutide.
      Not caught by the automated edit-distance check (below threshold);
      found by manual review. Relabel "maridebartcafraglutide" -> "maritide"
      (canonical spelling, see known_compounds) via a run's
      compound_relabels. Confirmed 2026-08-21 (cwm_wl_t2d run).
  - a: insuglar
    b: insulin glargine
    decision: same
    note: >
      "insuglar" appears only as a comparator-arm compound (e.g. surpass-4);
      real-world comparator is insulin glargine. Not caught by the automated
      edit-distance check (no substring/high-similarity signal); found by
      manual review. Relabel "insuglar" -> "insulin glargine" via a run's
      compound_relabels. Confirmed 2026-08-21 (cwm_wl_t2d run).
